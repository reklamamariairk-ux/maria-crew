# Builds an UNSIGNED .ipa of "Maria Admin" on a macOS runner.
# Unsigned because Sideloadly re-signs it with the user's free Apple ID on install.
# No Apple certificates needed. Download the .ipa artifact from the run.
name: iOS Admin unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm install
        run: |
          npm ci || npm install

      - name: Add iOS platform
        run: |
          npx cap add ios || echo "ios already added"

      - name: Generate icons
        run: |
          npx capacitor-assets generate --ios || echo "icons skipped"

      - name: cap sync
        run: |
          npx cap sync ios

      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/App.app
          zip -qr MariaAdmin-unsigned.ipa Payload
          ls -la MariaAdmin-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MariaAdmin-unsigned-ipa
          path: mobile-admin/ios/App/build/MariaAdmin-unsigned.ipa
          if-no-files-found: error
